# Actualizaciones automáticas (Dependabot abre un pull request por cada una; nada se publica solo).
# Las acciones de los workflows van fijadas por SHA con la versión en un comentario: Dependabot
# cambia los dos. La imagen postgres:17 de backup.yml (fijada por digest) se actualiza a mano.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    target-branch: dev
    groups:
      acciones:
        patterns: ["*"]

  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    target-branch: dev
    open-pull-requests-limit: 5
    # Sólo versiones con 7 días publicadas: una versión comprometida suele detectarse y retirarse antes
    # (revisión de seguridad 2026-11-18; también la regla de usar versiones con dos semanas).
    cooldown:
      default-days: 7
    groups:
      menores:
        update-types: ["minor", "patch"]
    # Saltos de versión grandes que se prueban aparte (PR cerrados el 2026-10-13): TypeScript 7 es una
    # reescritura (Vercel compila con TypeScript) y los tipos de Node siguen al Node 24 de producción.
    ignore:
      - dependency-name: "typescript"
        update-types: ["version-update:semver-major"]
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]
