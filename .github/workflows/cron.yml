name: Recordatorios y correos

# Recordatorios de citas, aislados de Vercel: este job se conecta directamente a la base de datos
# y a Gmail (scripts/cron.ts), así no gasta la CPU de Vercel. Las confirmaciones y avisos de las
# citas los envía la API al momento; aquí se envían los recordatorios, se reintentan los correos
# que fallaron y se limpia lo caducado. Avisa por ntfy y da señal de vida a healthchecks.io.
on:
  schedule:
    # Cada 10 minutos (repositorio público: minutos de Actions sin límite), en los minutos
    # 3, 13, 23… para esquivar el inicio de cada hora, cuando GitHub retrasa o descarta más
    # ejecuciones. Lo pausa si el repositorio pasa 60 días sin actividad.
    - cron: "3,13,23,33,43,53 * * * *"
  # "Run workflow" en la pestaña Actions, y despertador externo (cron-job.org) por la API de GitHub.
  workflow_dispatch:

concurrency:
  group: agendo-cron
  cancel-in-progress: false

jobs:
  ejecutar:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm

      - name: Instalar dependencias
        run: npm ci --omit=dev --ignore-scripts --no-audit --no-fund

      - name: Enviar recordatorios y avisar por ntfy
        env:
          NODE_ENV: production
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          DATABASE_SSL: "true"
          DATABASE_POOL_MAX: "3"
          FRONTEND_URL: ${{ vars.APP_URL }}
          GMAIL_USER: ${{ secrets.GMAIL_USER }}
          GMAIL_FROM_NAME: ${{ vars.GMAIL_FROM_NAME || 'Agenda360' }}
          GMAIL_CLIENT_ID: ${{ secrets.GMAIL_CLIENT_ID }}
          GMAIL_CLIENT_SECRET: ${{ secrets.GMAIL_CLIENT_SECRET }}
          GMAIL_REFRESH_TOKEN: ${{ secrets.GMAIL_REFRESH_TOKEN }}
          APP_URL: ${{ vars.APP_URL }}
          NTFY_SERVER: ${{ vars.NTFY_SERVER }}
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
        run: node scripts/cron.ts

      # Señal de vida para healthchecks.io: si deja de llegar, avisa que el cron se detuvo.
      - name: Avisar a healthchecks.io
        if: always()
        env:
          HEALTHCHECK_URL: ${{ secrets.HEALTHCHECK_URL }}
          SUFIJO: ${{ job.status != 'success' && '/fail' || '' }}
        run: |
          if [ -z "$HEALTHCHECK_URL" ]; then exit 0; fi
          curl -fsS -m 10 --retry 3 -o /dev/null "$HEALTHCHECK_URL$SUFIJO"
