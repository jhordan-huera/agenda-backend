# Publica el backend en AWS Lambda al hacer push a main (Vercel sigue publicando también, hasta que se
# quite allí). Sin claves de AWS guardadas: GitHub asume un rol de IAM con OIDC (ver README,
# "Backend en AWS Lambda"). En Settings → Secrets and variables → Actions:
#   Variable:  AWS_LAMBDA_FUNCTION (nombre de la función, p. ej. agenda-backend)
#   Secretos:  AWS_DEPLOY_ROLE_ARN (ARN del rol que asume GitHub; como variable también vale, pero el
#              registro mostraría el número de la cuenta de AWS) y AWS_LAMBDA_URL (Function URL, para
#              comprobar /api/health). Son secretos porque el repositorio es público y los registros
#              de Actions muestran el valor de las variables.
# Mientras no exista AWS_LAMBDA_FUNCTION, no hace nada. Sólo publica desde main, también si se lanza a
# mano (spec 009): el rol de IAM, además, sólo debería aceptar la rama main.
name: Publicar en AWS Lambda

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

concurrency:
  group: deploy-lambda
  cancel-in-progress: false

jobs:
  deploy:
    if: github.ref == 'refs/heads/main' && vars.AWS_LAMBDA_FUNCTION != ''
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24

      - name: Empaquetar (dependencias de producción)
        run: npm run lambda:package

      - uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN || vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: us-west-2

      - name: Subir el código a Lambda
        env:
          FUNCTION: ${{ vars.AWS_LAMBDA_FUNCTION }}
        run: |
          aws lambda update-function-code --function-name "$FUNCTION" --zip-file fileb://dist/lambda.zip --query LastUpdateStatus --output text
          aws lambda wait function-updated --function-name "$FUNCTION"

      - name: Comprobar /api/health
        env:
          LAMBDA_URL: ${{ secrets.AWS_LAMBDA_URL }}
        run: |
          if [ -z "$LAMBDA_URL" ]; then echo "Sin el secreto AWS_LAMBDA_URL: no se comprueba."; exit 0; fi
          curl -fsS --retry 3 --retry-delay 5 -o /dev/null -w "/api/health → %{http_code}\n" "${LAMBDA_URL%/}/api/health"
